[project]
name = "langues-ivoiriennes-ia"
version = "0.1.0"
description = "Prototype d'IA vocale Baoulé / Dioula exposée via une API REST"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["backend/tests", "ml/tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# Idiome standard FastAPI : Depends()/Query() en valeur par défaut.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.isort]
known-first-party = ["app", "ml"]
