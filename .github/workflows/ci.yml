name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Bouton « Run workflow » dans l'onglet Actions, pour relancer la CI à la main.
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff check)
        run: ruff check .
      - name: Mise en forme (ruff format --check)
        run: ruff format --check .
      - name: Tests (pytest, moteur mock)
        run: pytest -q
